<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Mate</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1720;
    --panel: #17212b;
    --border: #2a3644;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #3d8bfd;
    --you-bubble: #234b8a;
    --fm-bubble: #1f2a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  header button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 72ch;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.45;
    font-size: 14px;
  }
  .you {
    align-self: flex-end;
    background: var(--you-bubble);
  }
  .fm {
    align-self: flex-start;
    background: var(--fm-bubble);
    border: 1px solid var(--border);
  }
  .fm.pending { color: var(--muted); font-style: italic; }
  .fm.error { border-color: #a13b3b; color: #ff9d9d; }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    min-height: 44px;
    max-height: 160px;
  }
  button[type="submit"] {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>First Mate</h1>
      <div class="sub">local session &middot; this repo</div>
    </div>
    <button id="reset">New conversation</button>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Talk to your first mate..." autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('reset');

function addMessage(role, text, opts = {}) {
  const el = document.createElement('div');
  el.className = 'msg ' + role + (opts.pending ? ' pending' : '') + (opts.error ? ' error' : '');
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function send(message) {
  addMessage('you', message);
  const pending = addMessage('fm', 'thinking...', { pending: true });
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    pending.classList.remove('pending');
    if (!res.ok || data.error) {
      pending.classList.add('error');
      pending.textContent = data.error || ('request failed: ' + res.status);
    } else {
      pending.textContent = data.reply;
    }
  } catch (err) {
    pending.classList.remove('pending');
    pending.classList.add('error');
    pending.textContent = 'connection error: ' + err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  send(message);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

resetBtn.addEventListener('click', async () => {
  await fetch('/api/reset', { method: 'POST' });
  log.innerHTML = '';
  addMessage('fm', 'New conversation started.');
});
</script>
</body>
</html>
