<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Mate</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1720;
    --panel: #17212b;
    --border: #2a3644;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #3d8bfd;
    --you-bubble: #234b8a;
    --fm-bubble: #1f2a35;
    --code-bg: #0c141c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  header .right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #fleet-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #fleet-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  #fleet-toggle.active #fleet-dot { background: #3ddc84; }
  #fleet-panel {
    display: none;
    position: absolute;
    top: 54px;
    right: 20px;
    width: 420px;
    max-width: calc(100vw - 40px);
    max-height: 320px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 10;
    font-size: 12px;
  }
  #fleet-panel.open { display: block; }
  #fleet-panel .empty { color: var(--muted); padding: 6px 4px; }
  .fleet-row {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .fleet-row:last-child { margin-bottom: 0; }
  .fleet-row .id {
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .fleet-row .meta-line {
    color: var(--muted);
    margin-top: 2px;
  }
  .fleet-row .meta-line span { margin-right: 10px; }
  .fleet-row .latest {
    margin-top: 4px;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 72ch;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
  }
  .you {
    align-self: flex-end;
    background: var(--you-bubble);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .fm {
    align-self: flex-start;
    background: var(--fm-bubble);
    border: 1px solid var(--border);
  }
  .fm.pending { color: var(--muted); font-style: italic; }
  .fm.error { border-color: #a13b3b; color: #ff9d9d; }

  .fm p { margin: 0 0 10px; }
  .fm p:last-child { margin-bottom: 0; }
  .fm h1, .fm h2, .fm h3, .fm h4 { margin: 14px 0 8px; line-height: 1.3; }
  .fm h1:first-child, .fm h2:first-child, .fm h3:first-child { margin-top: 0; }
  .fm ul, .fm ol { margin: 0 0 10px; padding-left: 22px; }
  .fm li { margin: 2px 0; }
  .fm code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.9em;
  }
  .fm pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0 0 10px;
  }
  .fm pre code { background: none; padding: 0; }
  .fm a { color: var(--accent); }

  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    min-height: 44px;
    max-height: 160px;
  }
  button[type="submit"] {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>First Mate</h1>
      <div class="sub">local session &middot; this repo</div>
    </div>
    <div class="right">
      <button id="fleet-toggle"><span id="fleet-dot"></span><span id="fleet-label">Fleet: -</span></button>
      <button id="reset">New conversation</button>
    </div>
    <div id="fleet-panel"></div>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Talk to your first mate..." autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('reset');
const fleetToggle = document.getElementById('fleet-toggle');
const fleetLabel = document.getElementById('fleet-label');
const fleetPanel = document.getElementById('fleet-panel');

// --- minimal markdown renderer (headers, bold/italic, inline code, fenced
// code blocks, links, lists, paragraphs) - escapes HTML first so raw text
// can never inject markup. ---
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inlineMd(text) {
  text = escapeHtml(text);
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  text = text.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return text;
}

function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let inCode = false, codeBuf = [];
  let listType = null;
  let paraBuf = [];

  const flushPara = () => {
    if (paraBuf.length) { html += '<p>' + inlineMd(paraBuf.join(' ')) + '</p>'; paraBuf = []; }
  };
  const closeList = () => {
    if (listType) { html += '</' + listType + '>'; listType = null; }
  };

  for (const line of lines) {
    if (line.trim().startsWith('```')) {
      if (!inCode) { flushPara(); closeList(); inCode = true; codeBuf = []; }
      else { html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'; inCode = false; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara(); closeList();
      const level = h[1].length;
      html += `<h${level}>${inlineMd(h[2])}</h${level}>`;
      continue;
    }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul) {
      flushPara();
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + inlineMd(ul[1]) + '</li>';
      continue;
    }
    if (ol) {
      flushPara();
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += '<li>' + inlineMd(ol[1]) + '</li>';
      continue;
    }
    closeList();

    if (line.trim() === '') { flushPara(); continue; }
    paraBuf.push(line.trim());
  }
  if (inCode) html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>';
  flushPara();
  closeList();
  return html;
}

function addMessage(role, text, opts = {}) {
  const el = document.createElement('div');
  el.className = 'msg ' + role + (opts.pending ? ' pending' : '') + (opts.error ? ' error' : '');
  if (role === 'fm' && !opts.pending && !opts.error) {
    el.innerHTML = renderMarkdown(text);
  } else {
    el.textContent = text;
  }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setPendingText(el, text, { error = false } = {}) {
  el.classList.remove('pending');
  if (error) { el.classList.add('error'); el.textContent = text; }
  else { el.innerHTML = renderMarkdown(text); }
}

async function send(message) {
  addMessage('you', message);
  const pending = addMessage('fm', 'thinking...', { pending: true });
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      setPendingText(pending, data.error || ('request failed: ' + res.status), { error: true });
    } else {
      setPendingText(pending, data.reply);
    }
  } catch (err) {
    setPendingText(pending, 'connection error: ' + err.message, { error: true });
  } finally {
    sendBtn.disabled = false;
    input.focus();
    refreshFleet();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  send(message);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

resetBtn.addEventListener('click', async () => {
  await fetch('/api/reset', { method: 'POST' });
  log.innerHTML = '';
  addMessage('fm', 'New conversation started.');
});

// --- fleet fan-out status: how many tasks are running, what they're doing,
// which model/harness, polled from state/*.meta via /api/fleet. ---
function fleetRowHtml(task) {
  const latest = task.latest ? escapeHtml(task.latest) : 'no status yet';
  return `<div class="fleet-row">
    <div class="id">${escapeHtml(task.id)} <span style="color:var(--muted); font-weight:400;">(${escapeHtml(task.kind)})</span></div>
    <div class="meta-line">
      <span>project: ${escapeHtml(task.project)}</span>
      <span>harness: ${escapeHtml(task.harness)}</span>
      <span>model: ${escapeHtml(task.model)}</span>
    </div>
    <div class="latest">${latest}</div>
  </div>`;
}

async function refreshFleet() {
  try {
    const res = await fetch('/api/fleet');
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    const count = data.count || 0;
    fleetLabel.textContent = 'Fleet: ' + count + (count === 1 ? ' task' : ' tasks');
    fleetToggle.classList.toggle('active', count > 0);
    fleetPanel.innerHTML = count
      ? data.tasks.map(fleetRowHtml).join('')
      : '<div class="empty">No active work - the fleet is idle.</div>';
  } catch (err) {
    fleetLabel.textContent = 'Fleet: unavailable';
    fleetToggle.classList.remove('active');
    fleetPanel.innerHTML = `<div class="empty">Could not read fleet state: ${escapeHtml(err.message)}</div>`;
  }
}

fleetToggle.addEventListener('click', () => {
  fleetPanel.classList.toggle('open');
});

refreshFleet();
setInterval(refreshFleet, 5000);
</script>
</body>
</html>
